name: build-main

# Builds whatever is currently on this branch (all fixes included: Z
# direction, Z-probe inverting, stepper currents, probe remap) via
# PlatformIO on GitHub's own runners -- this sandbox can't reach the
# PlatformIO registry, GitHub Actions can.
#
# Build identity (Codex review finding 7, 2026-10-10; corrected again per
# issue #4, 2026-10-11): embeds the exact commit SHA into DETAILED_BUILD_VERSION
# via Marlin/Version.h (Marlin's own supported CUSTOM_VERSION_FILE mechanism),
# which M115.cpp actually reads -- the first version of this patched
# STRING_CONFIG_H_AUTHOR instead, which only shows in the startup banner, NOT
# in the M115 response itself. Pins the PlatformIO version instead of always
# installing latest, publishes a SHA256 + config manifest (now capturing
# indented declarations too) alongside the binary, and uses a fixed filename +
# explicit target_commitish so the release doesn't accumulate stale
# same-purpose assets under different names every push.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/master-brief-review-rabxqg
    paths:
      - "Marlin/**"
      - "ini/**"
      - "platformio.ini"
      - ".github/workflows/build-main.yml"

permissions:
  contents: write

concurrency:
  group: build-main-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO (pinned)
        run: pip install "platformio==6.1.19"

      - name: Embed commit SHA in firmware version string
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          sed -i "s|#define DETAILED_BUILD_VERSION .*|#define DETAILED_BUILD_VERSION \"main-build ${SHORT_SHA}\" // injected by build-main.yml -- this is what M115 actually reports|" Marlin/Version.h
          grep -q "CUSTOM_VERSION_FILE Version.h" Marlin/Configuration.h || { echo "CUSTOM_VERSION_FILE not enabled in Configuration.h -- Marlin/Version.h would be ignored"; exit 1; }
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Build STM32G0B1RE_btt
        run: pio run -e STM32G0B1RE_btt

      - name: Verify the identity string is actually in the compiled binary
        run: |
          strings .pio/build/STM32G0B1RE_btt/firmware.bin | grep -F "main-build ${SHORT_SHA}" \
            || { echo "FIRMWARE_NAME identity string not found in compiled binary -- refusing to publish"; exit 1; }

      - name: Prepare artifact, hash, and manifest
        run: |
          cp .pio/build/STM32G0B1RE_btt/firmware.bin firmware-main.bin
          sha256sum firmware-main.bin > firmware-main.bin.sha256
          {
            echo "commit: ${{ github.sha }}"
            echo "short_sha: ${SHORT_SHA}"
            echo "built_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "platformio_version: 6.1.19"
            echo "sha256: $(cut -d' ' -f1 firmware-main.bin.sha256)"
            echo "--- key config values ---"
            # Note the leading \s* -- MOTHERBOARD and the per-axis *_CURRENT values are
            # indented inside #ifndef/#if blocks; an unindented-only pattern silently
            # missed them before (issue #4).
            grep -E "^\s*#define (MOTHERBOARD|SERIAL_PORT|BAUDRATE|INVERT_Z_DIR|INVERT_X_DIR|INVERT_E0_DIR|Z_MIN_PROBE_ENDSTOP_INVERTING|Z_MIN_PROBE_PIN|EMERGENCY_PARSER|DETAILED_BUILD_VERSION|Z_CURRENT|X_CURRENT|Y_CURRENT|E0_CURRENT)\b" Marlin/Configuration.h Marlin/Configuration_adv.h Marlin/Version.h Marlin/src/pins/stm32g0/pins_BTT_SKR_MINI_E3_V3_0.h 2>/dev/null
          } > firmware-main.manifest.txt
          cat firmware-main.manifest.txt
          echo "--- sanity: required fields present? ---"
          for field in "commit:" "sha256:" "MOTHERBOARD" "DETAILED_BUILD_VERSION"; do
            grep -q "$field" firmware-main.manifest.txt || { echo "Manifest missing required field: $field"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-main-${{ env.SHORT_SHA }}
          path: |
            firmware-main.bin
            firmware-main.bin.sha256
            firmware-main.manifest.txt
          retention-days: 90

      - name: Refuse to publish an older commit over a newer one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq '.sha')
          if [ "$LATEST" != "${{ github.sha }}" ]; then
            echo "Branch tip is now $LATEST, this run is for ${{ github.sha }} -- a newer push is already ahead, skipping publish so this run can't overwrite it."
            echo "SKIP_PUBLISH=1" >> "$GITHUB_ENV"
          fi

      - name: Remove known-obsolete assets from the old naming scheme
        if: env.SKIP_PUBLISH != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Allowlist of names this workflow used to publish before the fixed-filename
          # change -- deliberately NOT "anything that isn't today's 3 files", since that
          # would also delete an unrelated asset someone else added to this release.
          gh release view main-build --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name' 2>/dev/null | grep -E '^firmware-main-[0-9a-f]+\.bin$' | while read -r name; do
            echo "Deleting known-obsolete asset: $name"
            gh release delete-asset main-build "$name" --repo "${{ github.repository }}" --yes || true
          done

      - name: Publish/update main-build release
        if: env.SKIP_PUBLISH != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-build
          name: main-build (latest)
          target_commitish: ${{ github.sha }}
          body: |
            Latest build of this project's actual main branch (claude/master-brief-review-rabxqg),
            commit ${{ github.sha }} -- includes all current fixes: INVERT_Z_DIR, Z_MIN_PROBE_ENDSTOP_INVERTING,
            stepper currents, probe remap to PC15. This release's assets are overwritten in place on every
            push to main (fixed filenames, not SHA-suffixed) -- see firmware-main.manifest.txt for the exact
            commit/config a given download corresponds to; don't assume the release body alone proves it
            if the release page was viewed before this run finished.
            The printer's actual `M115` response now carries this build's short SHA directly in its
            FIRMWARE_NAME line (via DETAILED_BUILD_VERSION) -- verify it there on the real printer, not
            just from this page or the binary's embedded strings.
          files: |
            firmware-main.bin
            firmware-main.bin.sha256
            firmware-main.manifest.txt
