name: build-firmware

# Builds the three bisection batches (commits c964220, 1aacf31, e49a451 on
# bisect/batch-audit) via PlatformIO on GitHub's own runners. This exists
# because the Claude Code sandbox used to develop this firmware cannot reach
# api.registry.platformio.org (outbound policy denial) -- GitHub Actions
# runners have normal internet access and are not subject to that block.
#
# Output: one firmware-batchN.bin per batch, uploaded as a workflow artifact
# and attached to a GitHub Release tagged "bisect-batches".

on:
  workflow_dispatch:
  push:
    branches:
      - bisect/batch-audit
      - bisect/batch-audit-v2
    paths:
      - ".github/workflows/build-firmware.yml"

permissions:
  contents: write

jobs:
  build-batch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: 0
            sha: e0b31759fc826bf1ece4c2d66852545c2bd34292
          - batch: 1
            sha: a89cdf449aa2efea54a3da151a1ccbf4f1e4c4a5
          - batch: 2
            sha: 5626eb471703001ee6e878aaa4e29028408e003f
    steps:
      - name: Check out batch ${{ matrix.batch }} (${{ matrix.sha }})
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO (pinned)
        run: pip install "platformio==6.1.19"

      - name: Build STM32G0B1RE_btt
        run: pio run -e STM32G0B1RE_btt

      - name: Prepare artifact, hash, and manifest
        run: |
          cp .pio/build/STM32G0B1RE_btt/firmware.bin firmware-batch${{ matrix.batch }}.bin
          sha256sum firmware-batch${{ matrix.batch }}.bin > firmware-batch${{ matrix.batch }}.bin.sha256
          {
            echo "batch: ${{ matrix.batch }}"
            echo "commit: ${{ matrix.sha }}"
            echo "platformio_version: 6.1.19"
            echo "sha256: $(cut -d' ' -f1 firmware-batch${{ matrix.batch }}.bin.sha256)"
          } > firmware-batch${{ matrix.batch }}.manifest.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-batch${{ matrix.batch }}
          path: |
            firmware-batch${{ matrix.batch }}.bin
            firmware-batch${{ matrix.batch }}.bin.sha256
            firmware-batch${{ matrix.batch }}.manifest.txt
          retention-days: 90

  release:
    needs: build-batch
    runs-on: ubuntu-latest
    steps:
      - name: Download all batch artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts into one directory
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.bin' -o -name '*.sha256' -o -name '*.manifest.txt' \) -exec cp {} out/ \;
          ls -la out

      - name: Publish/update bisect-batches release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bisect-batches
          name: bisect-batches
          body: |
            Automated bisection builds for the CR-10S Pro / SKR Mini E3 V3.0 heater/fan investigation.
            Batch 0 = stock Marlin 2.1.2.8 + only the board-targeting settings the official
            CR-10S + SKR Mini E3 3.0 example uses (not a verbatim copy of that example file --
            see docs/BUILD-LOG.md 2026-10-05 for why). Batch 1 = Batch 0 + this project's stepper
            currents. Batch 2 = Batch 1 + this project's probe architecture, but still carries
            INVERT_Z_DIR false (the official example's value) -- see BISECT-QUICKCHECK.md's
            safety notes before any Z motion on any of these three.
            Each .bin has a matching .sha256 and .manifest.txt (commit + hash) alongside it.
            See TEST-SCRIPTS/regression-runs/BISECT-QUICKCHECK.md for what to run with each one.
          files: out/*
